spring:
  application:
    name: leetsync-backend

  jackson:
    default-property-inclusion: non_null

  datasource:
    url: jdbc:postgresql://localhost:5432/leetsync
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cors:
    allowed-origin-patterns: "chrome-extension://*,http://localhost:3000,http://localhost:5173"

  github:
    api-base-url: "https://api.github.com"
    user-agent: "LeetSync-Spring-Boot"
    default-branch: "main"